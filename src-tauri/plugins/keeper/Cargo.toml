[package]
name = "keeper"
version = "0.1.0"
edition = "2021"
build = "build.rs"
links = "keeper"
autolib = false

[lib]
name = "keeper"
path = "src/lib.rs"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.tauri]
version = "2.10"
default-features = false

[build-dependencies.tauri-plugin]
version = "2.5"
features = ["build"]
