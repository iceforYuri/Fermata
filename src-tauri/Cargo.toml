[package]
name = "gika"
version = "0.0.0"
description = "gika —— 日常版面与任务调度"
edition = "2021"
rust-version = "1.77.2"
default-run = "gika"

[lib]
name = "gika_lib"
path = "src/lib.rs"

[[bin]]
name = "gika"
path = "src/main.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[[bin]]
name = "verify_m0"
path = "src/bin/verify_m0.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
user-idle = "0.5"
windows-sys = { version = "0.59", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
